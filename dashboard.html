<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Responsivo</title>
  <link rel="stylesheet" href="nancybarahona2.css">
</head>
<body>
  <div class="dashboard">
    
    <aside class="sidebar">
      <h2>Calificaciones</h2>
      <ul>
        <li><a href="#">Estudiante</a></li>
        <li><a href="#">Materias</a></li>
        <li><a href="#">Tareas</a></li>
        <li><a href="#">Evaluación</a></li>
      </ul>
    </aside>

 <!-- ahora el header y el main estan dentro de "content" -->
    <div class="content">
      <header class="header">
        <h1>Bienvenida, Alessia</h1>
        <input type="search" placeholder="Buscar...">
      </header>

      <main class="main">
        <section class="cards">
          <div class="card">Card 1</div>
          <div class="card">Card 2</div>
          <div class="card">Card 3</div>
          <div class="card">Card 4</div>
        </section>
      </main>
    </div>
    
  </div>
</body>
</html>
